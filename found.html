<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>照片袋0933 · 永光照相馆</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%238c1f1f'/><circle cx='50' cy='42' r='20' fill='%23f0e6d2'/><rect x='28' y='66' width='44' height='14' rx='3' fill='%23f0e6d2'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="chrome" data-page="pickup"></div>
<div class="wrap">
  <h2 class="page-title center" style="text-align:center;">照片袋 0933</h2>
  <p class="page-sub" style="text-align:center;">顾客：思粤 · 项目：婚纱合影 · 1996年</p>
  <div class="found-photo">
    <div class="big">
      <div class="img" id="found-img">
        <img class="found-photo-img" src="assets/wedding.jpg" alt="婚纱合影">
        <div class="face-fade" id="face-fade"></div>
      </div>
      <div class="note">1996年 · 永光照相馆 · 照片里的女孩，脸正在变淡
        <span class="prick" id="ch-吧" style="display:none;">吧</span>
      </div>
    </div>
    <div class="photo-actions">
      <button class="btn btn-ghost" onclick="seeNegative()">翻看底片（反色）</button>
      <button class="btn" onclick="findDarkroom()">去找暗房</button>
    </div>
    <p class="small muted" style="margin-top:18px;text-align:center;">你盯着照片看久了，女孩的脸越来越淡，像被什么东西慢慢擦去。</p>
  </div>
</div>
<div id="site-footer"></div>
<script src="js/common.js"></script>
<script>
setTimeout(function(){
  var f=$('face-fade'); if(f) f.classList.add('show');
},500);
function seeNegative(){
  State.data.sawNeg=true; State.save();
  var img=$('found-img');
  img.style.transition='filter .3s';
  img.style.filter='invert(1) hue-rotate(180deg)';
  /* 反色后，照片背面的针尖字才现出来 */
  var pk=$('ch-吧'); pk.style.display='inline-block'; prick({id:'ch-吧',ch:'吧'});
  toast('反色瞬间，照片角落还站着一个穿深色衣服的人——那是你');
  setTimeout(function(){
    img.style.filter='sepia(.3)';
    toast('合影背后，好像有什么在发光……');
  },2800);
}
function findDarkroom(){
  toast('暗房不在明处。留言板那句——合影里，好像多了一扇门。去样片墙看看那张合影。');
}
</script>
</body>
</html>

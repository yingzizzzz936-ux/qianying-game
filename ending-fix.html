<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定影 · 潜影</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%238c1f1f'/><circle cx='50' cy='42' r='20' fill='%23f0e6d2'/><rect x='28' y='66' width='44' height='14' rx='3' fill='%23f0e6d2'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="dark">
<div class="ending e-fix">
  <div class="e-box">
    <div class="e-title">定 影</div>
    <div class="e-sub">样片墙上，多了一对永远的合影</div>
    <div class="e-text">
      <p>你不愿走。你想，只要把她也定影在照片里，你们就能永远在一起。</p>
      <p>显影液的颜色一点点变深，红色安全灯剧烈地闪烁。她在照片里抬起头，眼里满是惊慌："别这样，梦回。该走的是你，不是我。"</p>
      <p>可你已经按下了定影。她的身影被一寸寸拉进照片，和你并肩站在一起，琥珀色的光把你们定格。</p>
      <p>从那以后，永光照相馆的样片墙上，多了一张怎么也取不下来的合影。照片里的两个人，微笑着，一动也不动。</p>
      <p>再后来，有客人在深夜听见暗房里传来轻轻的哭声——一个女孩的，一遍又一遍，求谁放她出去。</p>
      <p>没有人能。</p>
    </div>
    <div class="e-word">永 恒</div>
    <div class="e-actions">
      <button class="btn" onclick="replay()">重新来过</button>
      <button class="btn btn-ghost" onclick="go('index.html')">回到前厅</button>
    </div>
  </div>
</div>
<script src="js/common.js"></script>
<script>
guardEnding('fix');
function replay(){ State.reset(); go('index.html'); }
</script>
</body>
</html>

  <h2 class="page-title">关于我们</h2>
  <p class="page-sub">三十年，一家照相馆的故事</p>
  <div class="side-card">
    <h3>照相馆简介</h3>
    <p class="small">永光照相馆创办于1966年，是城里最老的照相馆。掌柜老陈师傅拍过三代人的脸，也送走过很多人。</p>
  </div>
  <div class="side-card">
    <h3>1996年 · 那场火</h3>
    <p class="small">那年回南天，照相馆老楼的电线老化，深夜起了一场火。火不大，却烧毁了老暗房。<b>有一位年轻顾客，在那夜之后再没出现过。</b></p>
  </div>
  <div class="side-card">
    <h3>老陈师傅的遗愿</h3>
    <p class="small">"我这辈子没洗出来的那张照片，是一个叫思粤的女孩留下的。她要找的人，其实一直没走。"</p>
  </div>
  <div class="side-card">
    <h3>城市变迁</h3>
    <p class="small">骑楼老街即将拆迁，照相馆也在其中。<a href="demolish.html">→ 看看拆迁后的照相馆</a></p>
  </div>
